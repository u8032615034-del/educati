<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educati</title>
    <link rel="icon" href="icone.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header class="site-header">
    <div class="logo-container left-align">
        <img src="icone.png" alt="Logo Educati" class="logo-icon">
        <span class="logo-text">Educati</span>
    </div>
    <nav class="header-nav">
        <ul>
            <li><a href="#" class="header-link">Fusionner PDF</a></li>
            <li><a href="#" class="header-link">Diviser PDF</a></li>
            <li><a href="#" class="header-link">Compresser PDF</a></li>
            <li><a href="#" class="header-link">Convertir PDF</a></li>
            <li><a href="#" class="header-link">Tous les outils PDF</a></li>
        </ul>
    </nav>
    <div class="header-actions">
        <div id="authButtons">
            <a href="connexion.html" class="header-btn login-btn">Se connecter</a>
            <a href="inscription.html" class="header-btn signup-btn">S'inscrire</a>
        </div>
        <div id="userAvatar" style="display: none; margin-left: 15px;">
            <div class="avatar" id="userInitial" style="width: 40px; height: 40px; border-radius: 50%; background-color: #4a90e2; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; text-transform: uppercase; cursor: pointer;"></div>
        </div>
    </div>
    <script>
        // Vérifier si l'utilisateur est connecté au chargement de la page
        document.addEventListener('DOMContentLoaded', function() {
            const userData = localStorage.getItem('currentUser');
            if (userData) {
                const user = JSON.parse(userData);
                // Masquer les boutons de connexion/inscription
                document.getElementById('authButtons').style.display = 'none';
                // Afficher l'avatar avec la première lettre du pseudo
                const userInitial = document.getElementById('userInitial');
                userInitial.textContent = user.pseudo.charAt(0).toUpperCase();
                document.getElementById('userAvatar').style.display = 'flex';
                
                // Redirection vers la page de compte au clic sur l'avatar
                userInitial.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href = 'compte.html';
                });
            }
        });
    </script>
</header>
    <main class="container">
        <section class="hero">
            <h1>Bienvenue sur Educati</h1>
            <p>Sélectionnez un fichier PDF à consulter en ligne.</p>
            <div class="upload-container">
                <input type="file" id="fileInput" accept=".pdf">
                <label for="fileInput" class="upload-btn" id="uploadBtn"><i class="fas fa-file-pdf btn-pdf-icon" aria-hidden="true"></i> Choisir un fichier PDF</label>
            </div>
        </section>
    </main>
    <script>
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file && file.type === 'application/pdf') {
            const reader = new FileReader();
            reader.onload = function(evt) {
                localStorage.setItem('pdfBase64', evt.target.result);
                window.location.href = 'pdf.html';
            };
            reader.readAsDataURL(file);
        } else {
            alert('Veuillez sélectionner un fichier PDF.');
        }
    });
    </script>
    <footer class="site-footer">
        <div class="footer-content">
            <span>&copy; 2025 Educati. Tous droits réservés.</span>
        </div>
    </footer>
</body>
</html>
