<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur PDF en ligne</title>
    <link rel="icon" href="icone.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="upload-container">
            <input type="file" id="fileInput" accept=".pdf">
            <label for="fileInput" class="upload-btn" id="uploadBtn">Choisir un fichier PDF</label>
        </div>
        <div class="pdf-container">
            <div class="pdf-controls">
                <div class="logo-container">
                    <img src="icone.png" alt="Logo" class="logo-icon">
                    <span class="logo-text">Educati</span>
                </div>
            </div>
            <canvas id="pdfCanvas" style="display:none;"></canvas>
        </div>
    </div>
    <script>
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file && file.type === 'application/pdf') {
            const reader = new FileReader();
            reader.onload = function(evt) {
                localStorage.setItem('pdfBase64', evt.target.result);
                window.location.href = 'pdf.html';
            };
            reader.readAsDataURL(file);
        } else {
            alert('Veuillez sélectionner un fichier PDF.');
        }
    });
    </script>
</body>
</html>
