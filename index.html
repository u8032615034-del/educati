<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenFarm</title>
    <link rel="icon" type="image/png" href="icone.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        .navbar {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            background-color: #f8f9fa;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .logo {
            display: flex;
            align-items: center;
            margin-right: 30px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 1.2em;
        }
        
        .logo img {
            height: 40px;
            margin-right: 10px;
        }
        
        .search-container {
            display: flex;
            width: 100%;
            max-width: 600px;
        }
        
        .search-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px 0 0 20px;
            font-size: 16px;
            outline: none;
        }
        
        .search-button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        
        .search-button:hover {
            background-color: #0056b3;
        }
        
        .content {
            padding: 30px;
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="#" class="logo">
            <img src="icone.png" alt="Logo">
            OpenFarm
        </a>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Rechercher...">
            <button class="search-button">
                <i class="fas fa-search"></i> Rechercher
            </button>
        </div>
    </nav>
    
    <main class="content">
        <h1>Bienvenue sur OpenFarm</h1>
        <p>Recherchez une plante pour obtenir des informations détaillées.</p>
        
        <div id="searchResults" class="search-results">
            <!-- Les résultats de la recherche s'afficheront ici -->
        </div>
    </main>
    
    <!-- Ajout de Font Awesome pour l'icône de recherche -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.querySelector('.search-input');
            const searchButton = document.querySelector('.search-button');
            const searchResults = document.getElementById('searchResults');
            
            // Fonction pour effectuer la recherche
            async function searchPlant() {
                const query = searchInput.value.trim();
                if (query === '') return;
                
                // Afficher un message de chargement
                searchResults.innerHTML = '<p class="loading">Recherche en cours...</p>';
                
                try {
                    // Appel à l'API de Wikipédia pour la recherche
                    const searchUrl = `https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query + ' plante')}&format=json&origin=*`;
                    const searchResponse = await fetch(searchUrl);
                    const searchData = await searchResponse.json();
                    
                    if (searchData.query.search.length === 0) {
                        searchResults.innerHTML = '<p class="no-results">Aucun résultat trouvé. Essayez avec un autre terme de recherche.</p>';
                        return;
                    }
                    
                    // Préparer l'affichage des résultats
                    searchResults.innerHTML = '<div class="results-container"></div>';
                    const resultsContainer = document.querySelector('.results-container');
                    
                    // Pour chaque résultat, créer un élément et ajouter l'image
                    for (const result of searchData.query.search) {
                        const pageUrl = `https://fr.wikipedia.org/?curid=${result.pageid}`;
                        const snippet = result.snippet.replace(/<span class="searchmatch">/g, '<strong>').replace(/<\/span>/g, '</strong>');
                        
                        // Créer l'élément de résultat
                        const resultElement = document.createElement('div');
                        resultElement.className = 'result-item';
                        
                        // Ajouter d'abord le contenu texte
                        resultElement.innerHTML = `
                            <div class="result-content">
                                <h3><a href="${pageUrl}" target="_blank">${result.title}</a></h3>
                                <p class="snippet">${snippet}...</p>
                                <a href="${pageUrl}" class="read-more" target="_blank">Lire la suite sur Wikipédia</a>
                            </div>
                            <div class="image-container">
                                <div class="image-placeholder">Chargement de l'image...</div>
                            </div>
                        `;
                        
                        resultsContainer.appendChild(resultElement);
                        
                        // Récupérer l'image
                        try {
                            const imageUrl = `https://fr.wikipedia.org/w/api.php?action=query&prop=pageimages&format=json&pithumbsize=300&pageids=${result.pageid}&origin=*`;
                            const imageResponse = await fetch(imageUrl);
                            const imageData = await imageResponse.json();
                            
                            const page = imageData.query.pages[result.pageid];
                            const imageSrc = page.thumbnail ? page.thumbnail.source : 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/No-Image-Placeholder.svg/300px-No-Image-Placeholder.svg.png';
                            
                            const imageContainer = resultElement.querySelector('.image-container');
                            if (imageContainer) {
                                imageContainer.innerHTML = `<img src="${imageSrc}" alt="${result.title}" class="plant-image">`;
                            }
                        } catch (error) {
                            console.error('Erreur lors du chargement de l\'image:', error);
                            const imageContainer = resultElement.querySelector('.image-container');
                            if (imageContainer) {
                                imageContainer.innerHTML = '<p class="no-image">Image non disponible</p>';
                            }
                        }
                    }
                } catch (error) {
                    console.error('Erreur lors de la recherche:', error);
                    searchResults.innerHTML = '<p class="error">Une erreur est survenue lors de la recherche. Veuillez réessayer.</p>';
                }
            }
            
            // Événements
            searchButton.addEventListener('click', searchPlant);
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchPlant();
                }
            });
        });
    </script>
    <style>
        .search-results {
            margin-top: 30px;
            text-align: left;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .results-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .result-item {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .result-content {
            flex: 1;
        }
        
        .image-container {
            width: 200px;
            min-width: 200px;
            height: 150px;
            background-color: #f5f5f5;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .plant-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .plant-image:hover {
            transform: scale(1.05);
        }
        
        .image-placeholder {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
        
        .result-item h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .result-item h3 a {
            color: #2c3e50;
            text-decoration: none;
        }
        
        .result-item h3 a:hover {
            text-decoration: underline;
        }
        
        .snippet {
            color: #555;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .read-more {
            color: #007bff;
            text-decoration: none;
            font-size: 0.9em;
        }
        
        .read-more:hover {
            text-decoration: underline;
        }
        
        .loading, .no-results, .error {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #666;
        }
        
        .error {
            color: #dc3545;
        }
    </style>
</body>
</html>
