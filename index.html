<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educati</title>
    <link rel="icon" href="icone.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <img src="icone.png" alt="Logo Educati" class="logo-icon">
            <span class="logo-text">Educati</span>
        </div>
    </header>
    <main class="container">
        <section class="hero">
            <h1>Bienvenue sur Educati</h1>
            <p>Sélectionnez un fichier PDF à consulter en ligne.</p>
            <div class="upload-container">
                <input type="file" id="fileInput" accept=".pdf">
                <label for="fileInput" class="upload-btn" id="uploadBtn">Choisir un fichier PDF</label>
            </div>
        </section>
    </main>
    <script>
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file && file.type === 'application/pdf') {
            const reader = new FileReader();
            reader.onload = function(evt) {
                localStorage.setItem('pdfBase64', evt.target.result);
                window.location.href = 'pdf.html';
            };
            reader.readAsDataURL(file);
        } else {
            alert('Veuillez sélectionner un fichier PDF.');
        }
    });
    </script>
    <footer class="site-footer">
        <div class="footer-content">
            <span>&copy; 2025 Educati. Tous droits réservés.</span>
        </div>
    </footer>
</body>
</html>
