<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educati</title>
    <link rel="icon" href="icone.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="upload-container">
            <input type="file" id="fileInput" accept=".pdf">
            <label for="fileInput" class="upload-btn" id="uploadBtn">Choisir un fichier PDF</label>
            <button id="changeDocumentBtn" class="change-doc-btn" style="display: none;">Changer de document</button>
        </div>

        <div class="pdf-container">
            <div class="pdf-controls">
                <div class="logo-container">
                    <img src="icone.png" alt="Logo Educati" class="logo-icon">
                    <span class="logo-text">Educati</span>
                </div>
                <button id="prevPage">Page précédente</button>
                <span id="pageInfo">Page: <span id="pageNum">-</span> / <span id="pageCount">-</span></span>
                <button id="nextPage">Page suivante</button>
                <input type="number" id="pageInput" min="1" placeholder="Aller à la page">
                <button id="zoomIn">+</button>
                <span id="zoomLevel">100%</span>
                <button id="zoomOut">-</button>
                <button id="infoBtn" class="info-btn" title="Informations PDF"><img src="image.png" alt="Info" style="width: 1.5em; height: 1.5em; vertical-align: middle;"></button>
            </div>
            <div class="pdf-viewer">
                <canvas id="pdfCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
document.addEventListener('DOMContentLoaded', function() {
    const pdfBase64 = localStorage.getItem('pdfBase64');
    if (pdfBase64) {
        fetch(pdfBase64)
          .then(res => res.arrayBuffer())
          .then(buf => {
            if (typeof loadPDF === 'function') {
              const file = new File([buf], 'document.pdf', {type: 'application/pdf'});
              loadPDF(file);
            } else {
              // fallback direct PDF.js
              pdfjsLib.getDocument({data: buf}).promise.then(function(pdfDoc_) {
                window.pdfDoc = pdfDoc_;
                window.pageNum = 1;
                renderPage(window.pageNum);
              });
            }
          })
          .catch(() => {
            alert('Erreur lors du décodage du PDF.');
          });
    } else {
        // Optionnel : masquer le canvas ou afficher un message
        alert('Aucun fichier PDF trouvé. Merci de retourner à l’accueil.');
        window.location.href = 'index.html';
    }
});
</script>
<script src="script.js"></script>
    <script>
        // Enregistrement du Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        // Vérification de la connexion au chargement
        window.addEventListener('load', function() {
            if (!navigator.onLine) {
                window.location.href = 'offline.html';
            }
        });

        // Surveillance des changements de connexion
        window.addEventListener('offline', function() {
            window.location.href = 'offline.html';
        });
    </script>
</body>
</html>
