<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Educati</title>
    <link rel="icon" href="icone.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="inscription-connexion.css">
</head>
<body>
    <header class="site-header">
        <div class="logo-container left-align">
            <img src="icone.png" alt="Logo Educati" class="logo-icon">
            <a href="index.html" class="logo-text" style="text-decoration:none;cursor:pointer;">Educati</a>
        </div>
    </header>
    <main class="container">
        <section class="hero">
            <h1>Connexion</h1>
            <form class="form-box" autocomplete="on">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" required autocomplete="username">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
                <button type="submit" class="upload-btn">Se connecter</button>
            </form>
            <p style="margin-top:16px;">Pas encore de compte ? <a href="inscription.html">S'inscrire</a></p>
        </section>
    </main>
    <footer class="site-footer">
        <div class="footer-content">
            <span>&copy; 2025 Educati. Tous droits réservés.</span>
        </div>
    </footer>
</body>
</html>
