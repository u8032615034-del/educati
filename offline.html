<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne - Educati</title>
    <link rel="icon" href="icone.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        
        .offline-container {
            max-width: 500px;
            padding: 20px;
            text-align: center;
            color: white;
        }
        
        .offline-icon {
            width: 100%;
            text-align: center;
            margin: 20px 0;
        }
        
        .offline-icon .offline-image {
            max-width: 120px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        
        h1 {
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        p {
            margin-bottom: 25px;
            color: #7f8c8d;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
            transition: background-color 0.3s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        
        .btn:hover {
            background-color: #2980b9;
        }
        
        .offline-btn {
            background-color: white;
            color: #2c3e50;
            border: 1px solid #2c3e50;
        }
        
        .offline-btn:hover {
            background-color: #f0f0f0;
            color: #2c3e50;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .logo-icon {
            height: 40px;
            width: 40px;
            margin-right: 10px;
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="logo-container">
            <img src="icone.png" alt="Logo Educati" class="logo-icon">
            <span class="logo-text">Educati</span>
        </div>
        
        <div class="offline-icon">
            <img src="offline.png" alt="Hors ligne" class="offline-image">
        </div>
        
        <h1>Vous êtes hors ligne</h1>
        <p>Il semble que vous n'ayez pas de connexion Internet. Veuillez vérifier votre connexion et réessayer.</p>
    </div>

    <script>
        // Vérifier la connexion au chargement
        window.addEventListener('load', function() {
            if (navigator.onLine) {
                // Si l'utilisateur est en ligne, rediriger vers la page d accueil
                window.location.href = 'index.html';
            }
        });

        // Vérifier quand la connexion revient
        window.addEventListener('online', function() {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
